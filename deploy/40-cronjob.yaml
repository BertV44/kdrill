# =============================================================================
# kdrill scheduled run.
#
# Before the first run:
#   1. Set EXPORT_MATCH to the name of the S3 location profile.
#   2. Label source namespaces with backup-tier and the opt-in label, or set
#      SELECTION_MODE=all to run without labelling anything.
#   3. Run once with DRY_RUN=true and read the selection out of the job log.
#
# Every value below is also the script default. The environment block is the
# supported way to change behaviour; the script itself is not edited.
#
# NOT PORTABLE AS SHIPPED: the image below is the OpenShift CLI image from
# registry.redhat.io. On vanilla Kubernetes it will not pull, because the
# cluster has no Red Hat pull secret. Replace it with any image that provides
# bash plus kubectl, and set KDRILL_CLI=kubectl. No specific alternative image
# is recommended here because none has been tested. [unverified]
# =============================================================================
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k10-restore-test
  namespace: k10-restore-test
spec:
  # Daily with a small batch is usually preferable to weekly with a large one:
  # the same coverage at a fraction of the peak load on storage and data movers.
  schedule: "0 3 * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # No automatic retry. A failed restore test is a signal to investigate,
      # not something to paper over with a rerun.
      backoffLimit: 0
      # Must exceed TIMEOUT_SECONDS plus cleanup time.
      activeDeadlineSeconds: 4200
      template:
        spec:
          serviceAccountName: k10-restore-test
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore-test
              image: registry.redhat.io/openshift4/ose-cli:latest
              command: ["/bin/bash", "/scripts/restore-test.sh"]
              env:
                # --- required ---
                - name: EXPORT_MATCH
                  value: "CHANGEME-s3-location-profile-name"
                - name: SELF_NS
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace

                # --- platform ---
                # Both are auto-detected. Uncomment only to override a
                # misdetection, or to force the vanilla Kubernetes path.
                # KDRILL_PLATFORM: auto | openshift | kubernetes
                # KDRILL_CLI     : oc | kubectl
                # DNS_NAMESPACE  : defaults to openshift-dns on OpenShift and
                #                  kube-system elsewhere. Set it if your
                #                  CoreDNS lives somewhere else, otherwise
                #                  pods will not resolve names and will never
                #                  reach Ready.
                # - name: KDRILL_PLATFORM
                #   value: "auto"
                # - name: KDRILL_CLI
                #   value: "oc"
                # - name: DNS_NAMESPACE
                #   value: "openshift-dns"

                # --- selection ---
                # opt-in  : requires INCLUDE_LABEL on the source namespace
                # opt-out : eligible unless EXCLUDE_LABEL is present
                # all     : every namespace holding a restore point, no label
                #           consulted. Use this for a first run on a cluster
                #           where nothing has been labelled yet.
                - name: SELECTION_MODE
                  value: "opt-in"
                - name: INCLUDE_LABEL
                  value: "k10.kasten.io/restore-test=enabled"
                # TIER_LABEL must be a flat key. A key containing dots or a
                # slash cannot be read by the dotted jsonpath lookup and every
                # namespace would silently fall back to DEFAULT_CADENCE_DAYS.
                # The script warns if you set one. [verified] on OpenShift 4.20.
                - name: TIER_LABEL
                  value: "backup-tier"
                - name: RP_SELECTION
                  value: "latest"
                # Label carrying the export location profile on an exported
                # restore point. [verified] on Kasten 9.0.4.
                - name: EXPORT_LABEL
                  value: "k10.kasten.io/exportProfile"

                # --- cadence targets, days ---
                - name: TIER1_CADENCE_DAYS
                  value: "7"
                - name: TIER2_CADENCE_DAYS
                  value: "30"
                - name: TIER3_CADENCE_DAYS
                  value: "90"
                - name: DEFAULT_CADENCE_DAYS
                  value: "30"

                # --- budgets ---
                - name: MAX_NAMESPACES_PER_RUN
                  value: "2"
                - name: MAX_RESTORE_GIB
                  value: "200"
                - name: MAX_NAMESPACE_GIB
                  value: "100"

                # --- execution ---
                - name: K10_NS
                  value: "kasten-io"
                - name: TARGET_SUFFIX
                  value: "-restored"
                - name: TIMEOUT_SECONDS
                  value: "3600"
                - name: POLL_INTERVAL
                  value: "20"
                - name: KEEP_ON_FAILURE
                  value: "true"
                - name: DRY_RUN
                  value: "false"
                # Requires curl in the image. [unverified] for
                # registry.redhat.io/openshift4/ose-cli. Metric push failures
                # are logged and non blocking.
                # - name: PUSHGATEWAY_URL
                #   value: "http://pushgateway.monitoring.svc:9091"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: script
              configMap:
                name: k10-restore-test-script
                defaultMode: 0555
