data:
  restore-test.sh: |
    #!/usr/bin/env bash
    #
    # kdrill, automated restore testing for Veeam Kasten.
    #
    # Restores exported (S3) restore points into <namespace><suffix> on the same
    # cluster, validates that workloads reach Ready, then removes the namespaces.
    #
    # Target   : Veeam Kasten 9.0.x on OpenShift 4.x or vanilla Kubernetes 1.x
    # API      : actions.kio.kasten.io/v1alpha1, apps.kio.kasten.io/v1alpha1
    # Selection: tier-based rotation, least-recently-tested first, budget capped
    #
    # Platform : the CLI (oc or kubectl) and the OpenShift-specific behaviour are
    #            both detected at runtime and can both be overridden. See
    #            detect_platform below for exactly what changes between the two.
    #
    # This file is the single source of truth. deploy/30-script-configmap.yaml is
    # generated from it by hack/build-configmap.sh and is never hand-edited.
    #
    # Constraint: no heredocs anywhere in this file. It is embedded in a YAML block
    # scalar, which forces indentation, and bash will not match an indented
    # terminator. Embedded YAML is emitted line by line with echo.

    set -euo pipefail

    # =====================================================================
    # Configuration
    # =====================================================================
    K10_NS="${K10_NS:-kasten-io}"
    SELF_NS="${SELF_NS:-k10-restore-test}"
    SUFFIX="${TARGET_SUFFIX:--restored}"
    EXPORT_MATCH="${EXPORT_MATCH:?EXPORT_MATCH is required (S3 location profile name)}"

    # Platform. All three are auto-detected and all three can be forced, so a
    # misdetection never blocks a run.
    CLI="${KDRILL_CLI:-}"                      # oc | kubectl, empty means detect
    PLATFORM="${KDRILL_PLATFORM:-auto}"        # auto | openshift | kubernetes
    DNS_NAMESPACE="${DNS_NAMESPACE:-}"         # empty means per-platform default

    # Label carrying the export location profile on an exported restore point.
    # This is the discriminator between exported and local restore points.
    # [verified] on Kasten 9.0.4: exported restore points carry
    # k10.kasten.io/exportProfile=<profile name>, local ones carry no such label.
    EXPORT_LABEL="${EXPORT_LABEL:-k10.kasten.io/exportProfile}"

    # Selection
    SELECTION_MODE="${SELECTION_MODE:-opt-in}"        # opt-in | opt-out | all
    INCLUDE_LABEL="${INCLUDE_LABEL:-k10.kasten.io/restore-test=enabled}"
    EXCLUDE_LABEL="${EXCLUDE_LABEL:-k10.kasten.io/restore-test=excluded}"
    TIER_LABEL="${TIER_LABEL:-backup-tier}"
    RP_SELECTION="${RP_SELECTION:-latest}"            # latest | random

    # Cadence targets, in days
    TIER1_CADENCE="${TIER1_CADENCE_DAYS:-7}"
    TIER2_CADENCE="${TIER2_CADENCE_DAYS:-30}"
    TIER3_CADENCE="${TIER3_CADENCE_DAYS:-90}"
    DEFAULT_CADENCE="${DEFAULT_CADENCE_DAYS:-30}"

    # Budgets
    MAX_NS="${MAX_NAMESPACES_PER_RUN:-3}"
    MAX_TOTAL_GIB="${MAX_RESTORE_GIB:-200}"
    MAX_ONE_GIB="${MAX_NAMESPACE_GIB:-100}"

    # Execution
    TIMEOUT="${TIMEOUT_SECONDS:-3600}"
    POLL="${POLL_INTERVAL:-20}"
    KEEP_ON_FAILURE="${KEEP_ON_FAILURE:-true}"
    DRY_RUN="${DRY_RUN:-false}"
    LEDGER="${LEDGER_CONFIGMAP:-k10-restore-test-ledger}"

    # Where coverage history lives.
    #   configmap : a ConfigMap in SELF_NS, the in-cluster default
    #   file      : a plain TAB separated file, for running kdrill from a
    #               workstation, a CI runner or any external scheduler with no
    #               Kubernetes object of its own. Back this file up: it IS the
    #               coverage record.
    LEDGER_BACKEND="${LEDGER_BACKEND:-configmap}"
    LEDGER_FILE="${LEDGER_FILE:-${HOME:-/tmp}/.kdrill/ledger}"

    # Namespaces never eligible, extended regex
    SYSTEM_NS_RE="${SYSTEM_NS_REGEX:-^(openshift|kube|default$|kasten-io$|k10-restore-test$)}"

    GIB=$(( 1024 * 1024 * 1024 ))
    NOW=$(date -u +%s)

    BRA=""
    RC=0
    declare -a CREATED_NS=()
    declare -a SUBJECT_NS=()
    declare -a SUBJECT_RP=()
    declare -a POOL_NS=()
    declare -a POOL_STALE=()

    log()  { printf '%s  %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"; }
    warn() { log "WARN: $*"; }
    fail() { log "ERROR: $*"; RC=1; }

    # =====================================================================
    # Platform and CLI detection
    #
    # kdrill runs on OpenShift and on vanilla Kubernetes. Exactly four things
    # differ between them, and each is gated on IS_OPENSHIFT:
    #
    #   1. the CLI binary, oc on OpenShift and kubectl elsewhere
    #   2. the SCC annotations copied onto the target namespace, which only
    #      exist on OpenShift
    #   3. the DNS namespace the NetworkPolicy allows egress to, openshift-dns
    #      against kube-system
    #   4. the OpenShift Route exclusion in the BatchRestoreAction, which names
    #      an API group that does not exist on vanilla Kubernetes
    #
    # Everything else, including the SCC-independent PSA enforce label, is
    # identical on both.
    # =====================================================================
    IS_OPENSHIFT=false

    detect_cli() {
      local c
      if [ -n "$CLI" ]; then
        if ! command -v "$CLI" >/dev/null 2>&1; then
          fail "KDRILL_CLI=${CLI} is not in PATH"
          exit 1
        fi
        return
      fi
      for c in oc kubectl; do
        if command -v "$c" >/dev/null 2>&1; then
          CLI="$c"
          return
        fi
      done
      fail "neither oc nor kubectl found in PATH"
      exit 1
    }

    detect_platform() {
      if ! "$CLI" api-versions >/dev/null 2>&1; then
        fail "cannot reach the cluster API using ${CLI}"
        exit 1
      fi

      case "$PLATFORM" in
        openshift)  IS_OPENSHIFT=true ;;
        kubernetes) IS_OPENSHIFT=false ;;
        auto)
          # security.openshift.io holds SecurityContextConstraints and exists on
          # every OpenShift cluster. It is a more reliable marker than
          # route.openshift.io, which a stripped install could lack.
          if "$CLI" api-versions 2>/dev/null | grep -q '^security\.openshift\.io/'; then
            IS_OPENSHIFT=true
          else
            IS_OPENSHIFT=false
          fi
          ;;
        *)
          fail "KDRILL_PLATFORM must be auto, openshift or kubernetes, got '${PLATFORM}'"
          exit 1
          ;;
      esac

      # On OpenShift prefer oc, unless the caller pinned the CLI explicitly.
      if [ "$IS_OPENSHIFT" = "true" ] && [ -z "${KDRILL_CLI:-}" ] \
         && command -v oc >/dev/null 2>&1; then
        CLI="oc"
      fi

      if [ -z "$DNS_NAMESPACE" ]; then
        if [ "$IS_OPENSHIFT" = "true" ]; then
          DNS_NAMESPACE="openshift-dns"
        else
          # CoreDNS ships in kube-system on a default kubeadm or managed cluster.
          # [unverified] on distributions that relocate it. Override with
          # DNS_NAMESPACE if yours differs, or pods will not resolve names and
          # will never reach Ready.
          DNS_NAMESPACE="kube-system"
        fi
      fi
    }

    # GNU date and BSD date parse an RFC3339 string with different flags. Getting
    # this wrong is not loud: date fails, days_since falls back to 99999, every
    # namespace looks never tested, the rotation degenerates and nothing in the log
    # looks wrong. So the flavour is detected once and a missing one is fatal.
    DATE_FLAVOUR=""

    detect_date_flavour() {
      if date -u -d "2000-01-01T00:00:00Z" +%s >/dev/null 2>&1; then
        DATE_FLAVOUR="gnu"
      elif date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "2000-01-01T00:00:00Z" +%s >/dev/null 2>&1; then
        DATE_FLAVOUR="bsd"
      else
        fail "no usable date implementation: neither GNU 'date -d' nor BSD 'date -j -f' works."
        fail "  Coverage ages cannot be computed, so the rotation would treat every"
        fail "  namespace as never tested. Install GNU coreutils or run in a container."
        exit 1
      fi
    }

    # Converts an RFC3339 timestamp to epoch seconds, 0 if unparseable.
    epoch_of() {
      case "$DATE_FLAVOUR" in
        gnu) date -u -d "$1" +%s 2>/dev/null || echo 0 ;;
        bsd) date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$1" +%s 2>/dev/null || echo 0 ;;
        *)   echo 0 ;;
      esac
    }

    # Warns about a label key that the dotted jsonpath form cannot read.
    # [verified] on OpenShift 4.20 / Kubernetes 1.33: a key containing hyphens
    # resolves correctly in dotted notation, but a key containing dots or a slash
    # silently returns empty, so every namespace would fall back to the default
    # cadence with nothing in the log looking wrong.
    check_tier_label() {
      case "$TIER_LABEL" in
        *.*|*/*)
          warn "TIER_LABEL='${TIER_LABEL}' contains a dot or a slash. The dotted"
          warn "  jsonpath lookup cannot read such a key and will return empty, so"
          warn "  every namespace will use DEFAULT_CADENCE_DAYS. Use a flat label"
          warn "  key such as backup-tier."
          ;;
      esac
    }

    # =====================================================================
    # Coverage ledger
    # =====================================================================
    # The ledger is the coverage record. Two backends, same contract: get returns a
    # timestamp or nothing, set records one and never aborts the run on failure.
    #
    # [verified] on OpenShift 4.20 / Kubernetes 1.33: a hyphenated key resolves in
    # dotted jsonpath, so a namespace name works directly as a ConfigMap key.
    ledger_get() {
      case "$LEDGER_BACKEND" in
        file)
          if [ -f "$LEDGER_FILE" ]; then
            awk -F'\t' -v k="$1" '$1 == k { print $2; exit }' "$LEDGER_FILE"
          fi
          ;;
        *)
          "$CLI" -n "$SELF_NS" get configmap "$LEDGER" \
            -o "jsonpath={.data.$1}" 2>/dev/null || true
          ;;
      esac
    }

    ledger_set() {
      local dir tmp
      case "$LEDGER_BACKEND" in
        file)
          dir=$(dirname "$LEDGER_FILE")
          if ! mkdir -p "$dir" 2>/dev/null; then
            warn "cannot create ledger directory ${dir}, coverage not recorded"
            return 0
          fi
          tmp="${LEDGER_FILE}.tmp.$$"
          # Rewrite whole file: drop any existing row for this key, append the new
          # one, sort for a stable diff. The group ends on printf so it always
          # exits 0, which matters under pipefail.
          {
            if [ -f "$LEDGER_FILE" ]; then
              awk -F'\t' -v k="$1" '$1 != k' "$LEDGER_FILE"
            fi
            printf '%s\t%s\n' "$1" "$2"
          } | LC_ALL=C sort > "$tmp"
          if ! mv "$tmp" "$LEDGER_FILE" 2>/dev/null; then
            rm -f "$tmp" 2>/dev/null || true
            warn "could not update ledger file for $1"
          fi
          ;;
        *)
          "$CLI" -n "$SELF_NS" patch configmap "$LEDGER" --type merge \
            -p "{\"data\":{\"$1\":\"$2\"}}" >/dev/null 2>&1 \
            || warn "could not update ledger entry for $1"
          ;;
      esac
    }

    days_since() {
      # $1 = RFC3339 timestamp, empty means never tested
      local ref
      if [ -z "$1" ]; then echo 99999; return; fi
      ref=$(epoch_of "$1")
      [ "$ref" -eq 0 ] && { echo 99999; return; }
      echo $(( (NOW - ref) / 86400 ))
    }

    cadence_for_tier() {
      case "$1" in
        1) echo "$TIER1_CADENCE" ;;
        2) echo "$TIER2_CADENCE" ;;
        3) echo "$TIER3_CADENCE" ;;
        *) echo "$DEFAULT_CADENCE" ;;
      esac
    }

    ns_has_label() {
      # $1 = namespace, $2 = label selector
      [ -n "$("$CLI" get namespace -l "$2" \
                -o "jsonpath={.items[?(@.metadata.name=='$1')].metadata.name}" \
                2>/dev/null)" ]
    }

    # =====================================================================
    # Stage 1: eligibility
    # Only namespaces holding at least one restore point are considered.
    # =====================================================================
    build_pool() {
      local ns tier cadence last age overdue

      for ns in $("$CLI" get restorepoints.apps.kio.kasten.io -A \
                    -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}' \
                    2>/dev/null | sort -u); do

        [[ "$ns" =~ $SYSTEM_NS_RE ]] && continue
        [[ "$ns" == *"$SUFFIX" ]] && continue

        # 'all' consults no label at all, which is what makes a first run
        # possible on a cluster where nothing has been labelled yet.
        case "$SELECTION_MODE" in
          opt-in)
            ns_has_label "$ns" "$INCLUDE_LABEL" || continue
            ;;
          opt-out)
            ns_has_label "$ns" "$EXCLUDE_LABEL" && continue
            ;;
          all)
            : # every namespace holding a restore point is eligible
            ;;
          *)
            fail "SELECTION_MODE must be opt-in, opt-out or all, got '${SELECTION_MODE}'"
            exit 1
            ;;
        esac

        tier=$("$CLI" get namespace "$ns" \
                 -o "jsonpath={.metadata.labels.$TIER_LABEL}" 2>/dev/null || true)
        cadence=$(cadence_for_tier "${tier:-default}")
        last=$(ledger_get "$ns")
        age=$(days_since "$last")
        overdue=$(( age - cadence ))

        POOL_NS+=("$ns")
        POOL_STALE+=("$overdue")
      done
    }

    # =====================================================================
    # Stage 2: priority ordering
    # Descending overdue days. Deterministic, reproducible, auditable.
    # =====================================================================
    ordered_pool() {
      local i
      for i in "${!POOL_NS[@]}"; do
        printf '%012d %s\n' "$(( 999999 - POOL_STALE[i] ))" "${POOL_NS[$i]}"
      done | sort | awk '{print $2}'
    }

    # =====================================================================
    # Stage 3: resolve the exported restore point for one namespace
    #
    # Exported restore points carry the export location profile as a label,
    # EXPORT_LABEL, whose value is the profile name. Local restore points carry
    # no such label. Selection is therefore a server-side label selector.
    #
    # [verified] on Kasten 9.0.4, OpenShift 4.20: exported restore points carry
    # k10.kasten.io/exportProfile=<profile>, alongside k10.kasten.io/exportType.
    # Restore points produced by a backup-only policy carry neither, even when
    # that policy references an export profile in its own spec.
    #
    # This replaces an earlier substring grep over the restorepoints/{name}/details
    # payload. That approach was measured to produce false positives: a local
    # restore point from a policy whose spec names the export profile matched the
    # grep, so kdrill would have restored local snapshots while reporting that it
    # had tested the export path. The label is exact, and it costs one API call
    # per namespace instead of one per restore point.
    #
    # Restore points are walked newest first, so the scan normally stops on the
    # first candidate.
    # =====================================================================
    resolve_exported_rp() {
      local ns="$1" rp
      local -a matches=()

      while read -r _ rp; do
        [ -z "$rp" ] && continue
        matches+=("$rp")
        [ "$RP_SELECTION" = "latest" ] && break
      done < <("$CLI" -n "$ns" get restorepoints.apps.kio.kasten.io \
                 -l "${EXPORT_LABEL}=${EXPORT_MATCH}" \
                 -o jsonpath='{range .items[*]}{.status.actionTime}{" "}{.metadata.name}{"\n"}{end}' \
                 2>/dev/null | sort -r)

      [ "${#matches[@]}" -eq 0 ] && return 1

      if [ "$RP_SELECTION" = "random" ] && [ "${#matches[@]}" -gt 1 ]; then
        echo "${matches[$(( RANDOM % ${#matches[@]} ))]}"
      else
        echo "${matches[0]}"
      fi
    }

    rp_size_gib() {
      local bytes
      bytes=$("$CLI" -n "$1" get restorepoints.apps.kio.kasten.io "$2" \
                -o jsonpath='{.status.logicalSizeBytes}' 2>/dev/null || echo 0)
      [ -z "$bytes" ] && bytes=0
      echo $(( bytes / GIB ))
    }

    # =====================================================================
    # Stage 4: budget enforcement
    # Walk the priority list and admit namespaces until a budget is reached.
    # =====================================================================
    apply_budgets() {
      local ns rp size total=0 sizeless=0
      log "--- selection ---"

      for ns in $(ordered_pool); do
        if [ "${#SUBJECT_NS[@]}" -ge "$MAX_NS" ]; then
          log "namespace budget reached (${MAX_NS}), stopping selection"
          break
        fi

        if ! rp=$(resolve_exported_rp "$ns"); then
          warn "${ns} skipped, no exported restore point matching '${EXPORT_MATCH}'"
          continue
        fi

        size=$(rp_size_gib "$ns" "$rp")
        [ "$size" -eq 0 ] && sizeless=$(( sizeless + 1 ))

        if [ "$size" -gt "$MAX_ONE_GIB" ]; then
          warn "${ns} skipped, ${size} GiB exceeds the per-namespace budget (${MAX_ONE_GIB} GiB), needs a dedicated run"
          continue
        fi

        if [ $(( total + size )) -gt "$MAX_TOTAL_GIB" ]; then
          log "${ns} deferred, would exceed the aggregate budget (${MAX_TOTAL_GIB} GiB)"
          continue
        fi

        total=$(( total + size ))
        SUBJECT_NS+=("$ns")
        SUBJECT_RP+=("$rp")
        log "selected  ${ns}  rp=${rp}  size=${size}GiB  running_total=${total}GiB"
      done

      log "--- ${#SUBJECT_NS[@]} namespace(s) selected, ${total} GiB total ---"

      # A restore point that reports no size silently disables the GiB budgets,
      # which is exactly the kind of quiet degradation this tool exists to expose.
      # [verified] on Kasten 9.0.4: .status.logicalSizeBytes is populated on local
      # restore points but absent on exported ones, and exported ones are what
      # kdrill selects. So in practice the GiB budgets are usually inert and
      # MAX_NAMESPACES_PER_RUN is the cap that actually bites.
      if [ "$sizeless" -gt 0 ]; then
        warn "${sizeless} of ${#SUBJECT_NS[@]} selected restore point(s) reported no size."
        warn "  MAX_RESTORE_GIB and MAX_NAMESPACE_GIB cannot constrain this run."
        warn "  Limit the workload with MAX_NAMESPACES_PER_RUN instead."
      fi
    }

    # =====================================================================
    # Target namespace preparation
    # Created ahead of the restore so isolation and SCC context are in place
    # before the first pod starts.
    # =====================================================================
    prepare_target_ns() {
      local src="$1" tgt="$2"
      local uid_range sup_groups psa_enforce

      uid_range=""
      sup_groups=""

      # SCC annotations exist only on OpenShift. On vanilla Kubernetes the
      # namespace is created without them, which is correct: there is no SCC
      # admission plugin to satisfy.
      if [ "$IS_OPENSHIFT" = "true" ]; then
        uid_range=$("$CLI" get ns "$src" \
          -o jsonpath='{.metadata.annotations.openshift\.io/sa\.scc\.uid-range}' 2>/dev/null || true)
        sup_groups=$("$CLI" get ns "$src" \
          -o jsonpath='{.metadata.annotations.openshift\.io/sa\.scc\.supplemental-groups}' 2>/dev/null || true)
      fi

      # Pod Security Admission is upstream Kubernetes, so this applies on both.
      psa_enforce=$("$CLI" get ns "$src" \
        -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}' 2>/dev/null || true)

      {
        echo "apiVersion: v1"
        echo "kind: Namespace"
        echo "metadata:"
        echo "  name: ${tgt}"
        echo "  labels:"
        echo "    k10.kasten.io/restore-test: \"true\""
        echo "    k10.kasten.io/restore-test-source: \"${src}\""
        # These are if blocks rather than `[ -n "$x" ] && echo`, deliberately. A
        # trailing `&&` list whose test fails makes this whole group exit non-zero,
        # and with `set -o pipefail` that fails the pipeline and kills the script
        # under `set -e`, after the namespace exists but before the NetworkPolicy is
        # applied. An `if` whose condition is false exits 0, so the group cannot
        # fail on an absent optional annotation. Do not condense these back.
        if [ -n "$psa_enforce" ]; then
          echo "    pod-security.kubernetes.io/enforce: \"${psa_enforce}\""
        fi
        if [ -n "$uid_range" ] || [ -n "$sup_groups" ]; then
          echo "  annotations:"
          if [ -n "$uid_range" ]; then
            echo "    openshift.io/sa.scc.uid-range: \"${uid_range}\""
          fi
          if [ -n "$sup_groups" ]; then
            echo "    openshift.io/sa.scc.supplemental-groups: \"${sup_groups}\""
          fi
        fi
      } | "$CLI" create -f - >/dev/null

      CREATED_NS+=("$tgt")

      # Deny all traffic except intra-namespace and DNS. Without the DNS
      # exception, pods that resolve names at startup never reach Ready,
      # which would invalidate the success criterion.
      {
        echo "apiVersion: networking.k8s.io/v1"
        echo "kind: NetworkPolicy"
        echo "metadata:"
        echo "  name: restore-test-isolation"
        echo "spec:"
        echo "  podSelector: {}"
        echo "  policyTypes: [Ingress, Egress]"
        echo "  ingress:"
        echo "    - from:"
        echo "        - podSelector: {}"
        echo "  egress:"
        echo "    - to:"
        echo "        - podSelector: {}"
        echo "    - to:"
        echo "        - namespaceSelector:"
        echo "            matchLabels:"
        echo "              kubernetes.io/metadata.name: ${DNS_NAMESPACE}"
        echo "      ports:"
        echo "        - protocol: UDP"
        echo "          port: 5353"
        echo "        - protocol: TCP"
        echo "          port: 5353"
        echo "        - protocol: UDP"
        echo "          port: 53"
        echo "        - protocol: TCP"
        echo "          port: 53"
      } | "$CLI" -n "$tgt" create -f - >/dev/null

      log "target namespace ${tgt} ready, network isolation applied"
    }

    build_bra() {
      local i
      echo "apiVersion: actions.kio.kasten.io/v1alpha1"
      echo "kind: BatchRestoreAction"
      echo "metadata:"
      echo "  generateName: restoretest-"
      echo "  namespace: ${K10_NS}"
      echo "  labels:"
      echo "    k10.kasten.io/restore-test: \"true\""
      echo "spec:"
      echo "  targetNamespaceSuffix: \"${SUFFIX}\""
      echo "  skipWaitForWorkloadReady: false"
      # The ingress path is excluded on both platforms, by the resource that owns
      # it there. This is the same trade in both cases: the restored copy is never
      # reachable from outside, and the ingress configuration is not covered by the
      # test. docs/scope.md states that consequence.
      #
      # OpenShift: a Route with an explicit spec.host collides with the original
      # and fails with HostAlreadyClaimed. A hard failure, but a failure.
      #
      # Kubernetes: an Ingress duplicating a production host does NOT usually fail.
      # A typical controller accepts both and resolves it by its own rules, so the
      # restored copy can end up serving production traffic. That is worse than a
      # failed test, which is why the filter is not optional here.
      #
      # Note for OpenShift readers: OpenShift also accepts Ingress objects and
      # materialises a Route from them, so an application that uses Ingress rather
      # than Route on OpenShift is not covered by the Route filter alone. Add
      # ingresses to the OpenShift branch if that is your case.
      echo "  filters:"
      echo "    excludeResources:"
      if [ "$IS_OPENSHIFT" = "true" ]; then
        echo "      - group: route.openshift.io"
        echo "        version: v1"
        echo "        resource: routes"
      else
        echo "      - group: networking.k8s.io"
        echo "        version: v1"
        echo "        resource: ingresses"
      fi
      echo "  subjects:"
      for i in "${!SUBJECT_NS[@]}"; do
        echo "    - namespace: ${SUBJECT_NS[$i]}"
        echo "      restorePointName: ${SUBJECT_RP[$i]}"
      done
    }

    cleanup() {
      local ns deadline phase
      log "--- cleanup ---"

      for ns in "${CREATED_NS[@]:-}"; do
        [ -z "$ns" ] && continue
        log "deleting namespace ${ns}"
        # --wait=false is load bearing. The RBAC grants get, list and delete on
        # namespaces but deliberately not watch, and the CLI's default wait opens a
        # watch. Termination is polled with `get` in the loop below instead.
        "$CLI" delete namespace "$ns" --wait=false --ignore-not-found >/dev/null 2>&1 || true
      done

      # Namespaces stuck in Terminating are reported, never force deleted.
      # Removing finalizers blindly can orphan operator-managed resources.
      deadline=$(( $(date +%s) + 300 ))
      for ns in "${CREATED_NS[@]:-}"; do
        [ -z "$ns" ] && continue
        while "$CLI" get namespace "$ns" >/dev/null 2>&1; do
          if [ "$(date +%s)" -ge "$deadline" ]; then
            phase=$("$CLI" get namespace "$ns" -o jsonpath='{.status.phase}' 2>/dev/null || echo "unknown")
            fail "namespace ${ns} still present after 300s (phase=${phase}), inspect finalizers"
            break
          fi
          sleep 10
        done
      done

      if [ -n "$BRA" ]; then
        "$CLI" -n "$K10_NS" delete batchrestoreaction "$BRA" --ignore-not-found >/dev/null 2>&1 || true
      fi
    }

    metrics_body() {
      # $1 selected, $2 succeeded, $3 failed, $4 untested, $5 max staleness
      printf 'k10_restore_test_eligible_namespaces %s\n' "${#POOL_NS[@]}"
      printf 'k10_restore_test_selected_namespaces %s\n' "$1"
      printf 'k10_restore_test_succeeded_namespaces %s\n' "$2"
      printf 'k10_restore_test_failed_namespaces %s\n' "$3"
      printf 'k10_restore_test_untested_namespaces %s\n' "$4"
      printf 'k10_restore_test_max_staleness_days %s\n' "$5"
      printf 'k10_restore_test_last_run_timestamp %s\n' "$NOW"
    }

    emit_metrics() {
      local selected="$1" succeeded="$2" failed="$3"
      local ns age last max_stale=0 untested=0

      for ns in "${POOL_NS[@]:-}"; do
        [ -z "$ns" ] && continue
        last=$(ledger_get "$ns")
        if [ -z "$last" ]; then
          untested=$(( untested + 1 ))
          continue
        fi
        age=$(days_since "$last")
        [ "$age" -gt "$max_stale" ] && max_stale="$age"
      done

      log "--- coverage ---"
      metrics_body "$selected" "$succeeded" "$failed" "$untested" "$max_stale" \
        | while read -r line; do log "$line"; done

      if [ -n "${PUSHGATEWAY_URL:-}" ]; then
        metrics_body "$selected" "$succeeded" "$failed" "$untested" "$max_stale" \
          | curl -sf --data-binary @- \
              "${PUSHGATEWAY_URL}/metrics/job/k10_restore_test" >/dev/null \
          || warn "metrics push failed, non blocking"
      fi
    }

    # =====================================================================
    # Main
    # =====================================================================
    log "=== Veeam Kasten restore test ==="

    detect_cli
    detect_platform
    detect_date_flavour
    check_tier_label

    case "$LEDGER_BACKEND" in
      configmap|file) : ;;
      *) fail "LEDGER_BACKEND must be configmap or file, got '${LEDGER_BACKEND}'"; exit 1 ;;
    esac

    if [ "$IS_OPENSHIFT" = "true" ]; then
      log "platform: OpenShift, cli: ${CLI}, dns namespace: ${DNS_NAMESPACE}"
    else
      log "platform: Kubernetes, cli: ${CLI}, dns namespace: ${DNS_NAMESPACE}"
      log "  OpenShift specifics disabled: no SCC annotations copied, no Route exclusion"
    fi
    log "selection mode: ${SELECTION_MODE}, restore point selection: ${RP_SELECTION}"
    log "export label: ${EXPORT_LABEL}=${EXPORT_MATCH}"
    if [ "$LEDGER_BACKEND" = "file" ]; then
      log "ledger: file ${LEDGER_FILE} (no Kubernetes object holds coverage state)"
    else
      log "ledger: configmap ${SELF_NS}/${LEDGER}"
    fi
    log "date: ${DATE_FLAVOUR}"
    log "budgets: ${MAX_NS} namespaces, ${MAX_TOTAL_GIB} GiB total, ${MAX_ONE_GIB} GiB per namespace"

    build_pool
    log "eligible namespaces: ${#POOL_NS[@]}"
    apply_budgets

    if [ "${#SUBJECT_NS[@]}" -eq 0 ]; then
      log "nothing selected, exiting"
      emit_metrics 0 0 0
      exit 0
    fi

    if [ "$DRY_RUN" = "true" ]; then
      log "DRY_RUN enabled, no restore performed"
      emit_metrics "${#SUBJECT_NS[@]}" 0 0
      exit 0
    fi

    # Stage the target namespaces, dropping any that cannot be prepared
    declare -a STAGED_NS=()
    declare -a STAGED_RP=()
    for i in "${!SUBJECT_NS[@]}"; do
      src="${SUBJECT_NS[$i]}"
      tgt="${src}${SUFFIX}"

      if [ ${#tgt} -gt 63 ]; then
        fail "${tgt} exceeds 63 characters (RFC 1123), skipped"
        continue
      fi
      if "$CLI" get namespace "$tgt" >/dev/null 2>&1; then
        fail "${tgt} already exists, leftover from a previous run, skipped"
        continue
      fi

      prepare_target_ns "$src" "$tgt"
      STAGED_NS+=("$src")
      STAGED_RP+=("${SUBJECT_RP[$i]}")
    done

    if [ "${#STAGED_NS[@]}" -eq 0 ]; then
      fail "no namespace could be staged"
      cleanup
      exit 1
    fi

    SUBJECT_NS=("${STAGED_NS[@]}")
    SUBJECT_RP=("${STAGED_RP[@]}")

    BRA=$(build_bra | "$CLI" create -f - -o jsonpath='{.metadata.name}')
    log "BatchRestoreAction created: ${BRA}"

    # The batch reaches Complete only when every subordinate action succeeds,
    # workload readiness included.
    deadline=$(( $(date +%s) + TIMEOUT ))
    while :; do
      state=$("$CLI" -n "$K10_NS" get batchrestoreaction "$BRA" \
                -o jsonpath='{.status.state}' 2>/dev/null || echo "")
      pct=$("$CLI" -n "$K10_NS" get batchrestoreaction "$BRA" \
                -o jsonpath='{.status.progress}' 2>/dev/null || echo "0")

      case "$state" in
        Complete) log "state=Complete (${pct}%)"; break ;;
        Failed)   fail "state=Failed (${pct}%)"; break ;;
        *)        log "state=${state:-Pending} (${pct}%)" ;;
      esac

      if [ "$(date +%s)" -ge "$deadline" ]; then
        fail "timed out after ${TIMEOUT}s (last state: ${state:-unknown})"
        break
      fi
      sleep "$POLL"
    done

    # Per-namespace outcome, ledger updated on success only
    log "--- subordinate actions ---"
    succeeded=0
    failed=0
    while read -r ans astate; do
      [ -z "$ans" ] && continue
      src="${ans%"$SUFFIX"}"
      if [ "$astate" = "Complete" ]; then
        succeeded=$(( succeeded + 1 ))
        ledger_set "$src" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        log "PASS  ${src}"
      else
        failed=$(( failed + 1 ))
        log "FAIL  ${src} (state=${astate:-unknown})"
      fi
    done < <("$CLI" get restoreactions.actions.kio.kasten.io -A \
               -l "k10.kasten.io/batchRestoreActionName=${BRA}" \
               -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.status.state}{"\n"}{end}' \
               2>/dev/null)

    if [ "$failed" -gt 0 ]; then
      RC=1
    fi

    if [ "$RC" -ne 0 ]; then
      for ns in "${CREATED_NS[@]:-}"; do
        [ -z "$ns" ] && continue
        log "--- pods not Ready in ${ns} ---"
        "$CLI" -n "$ns" get pods \
          --field-selector=status.phase!=Running,status.phase!=Succeeded \
          -o wide 2>/dev/null || true
      done
    fi

    emit_metrics "${#SUBJECT_NS[@]}" "$succeeded" "$failed"

    if [ "$RC" -ne 0 ] && [ "$KEEP_ON_FAILURE" = "true" ]; then
      log "failure detected, namespaces retained for analysis: ${CREATED_NS[*]:-}"
      log "manual cleanup: ${CLI} delete ns ${CREATED_NS[*]:-}"
      exit 1
    fi

    cleanup
    log "=== finished (rc=${RC}) ==="
    exit "$RC"
